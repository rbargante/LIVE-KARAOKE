<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS CANTA AGORA</title>
  <style>
    body{background:#000;color:#fff;margin:0;font-family:sans-serif;}
    #lightbox{display:none;position:fixed;z-index:999;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);justify-content:center;align-items:center;}
    #lightbox img{max-width:90%;max-height:80%;cursor:pointer;}
    .g{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:20px;}
    .gi{aspect-ratio:1;border-radius:10px;cursor:pointer;overflow:hidden;}
    .gi img{width:100%;height:100%;object-fit:cover;}
    .admin{display:none;padding:20px;background:#111;margin:10px;border-radius:10px;}
  </style>
</head>
<body>
  <div id="lightbox" onclick="this.style.display='none'"><img id="lb-img"></div>
  <h1>OS CANTA AGORA</h1>
  <div id="vCount">👥 0</div>
  <div id="g" class="g"></div>
  <button onclick="document.getElementById('admin').style.display='block'">ADMIN</button>
  
  <div id="admin" class="admin">
    <button onclick="this.parentElement.style.display='none'">X</button>
    <button onclick="save()">GUARDAR</button>
  </div>

  <script>
    const DB = "https://karaokelive-ca58e-default-rtdb.europe-west1.firebasedatabase.app/";
    
    // Automatização do contador e lightbox
    async function init(){
      const res = await fetch(DB+"config.json");
      const d = await res.json();
      const g = document.getElementById('g');
      d.gal?.forEach(i => {
        const div = document.createElement('div');
        div.className='gi';
        div.innerHTML=`<img src="${i}">`;
        div.onclick=() => { document.getElementById('lb-img').src=i; document.getElementById('lightbox').style.display='flex'; };
        g.appendChild(div);
      });
      // Contador automático
      fetch(DB+"onlineUsers.json", {method:'POST', body:JSON.stringify({t:Date.now()})});
      setInterval(async()=>{
        const r = await fetch(DB+"onlineUsers.json");
        const o = await r.json();
        document.getElementById('vCount').textContent = '👥 ' + (o?Object.keys(o).length:1);
      },5000);
    }
    
    async function save(){
      const d = {num:document.getElementById('inNum').value};
      await fetch(DB+"config.json", {method:'PUT', body:JSON.stringify(d)});
      location.reload();
    }
    init();
  </script>
</body>
</html>
