<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OS CANTA AGORA KARAOKE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root { --primary-color: #f52a1f; --dark: #000; --card: #0a0a0a; }
    * { box-sizing: border-box; }
    body { background: #000; color: #fff; margin: 0; padding: 0; font-family: sans-serif; }
    .container { max-width: 1120px; margin: 0 auto; padding: 15px; }
    .video-box { background: #000; border-radius: 20px; overflow: hidden; border: 1px solid #222; width: 100%; aspect-ratio: 16/9; }
    .btn-red { background: var(--primary-color); color: #fff; border: none; padding: 16px 32px; border-radius: 14px; font-weight: 800; cursor: pointer; display: block; margin: 20px auto; }
    .admin-panel { display: none; background: #111; padding: 20px; margin-top: 50px; border-radius: 20px; }
    .admin-input { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>OS CANTA AGORA KARAOKE</h1>
    
    <div class="video-box">
      <iframe id="livePlayer" src="" style="width:100%; height:100%; border:0;" allowfullscreen allow="autoplay"></iframe>
    </div>

    <div id="budgetArea">
      <button class="btn-red" style="background:#25d366" onclick="openWaBudget()">⚡ PEDIR ORÇAMENTO GRÁTIS EM 1 MINUTO</button>
    </div>

    <h2 style="text-align:center;">ARQUIVO DE VÍDEOS</h2>
    <div id="vidGrid" class="grid">A carregar vídeos...</div>

    <div style="text-align:center; margin-top:30px;">
        <button onclick="showAdmin()" style="background:none; border:1px solid #333; color:#fff; cursor:pointer;">ADMIN</button>
    </div>

    <div id="adminArea" class="admin-panel">
      <div id="loginForm">
        <input id="u" class="admin-input" placeholder="Utilizador">
        <input id="p" type="password" class="admin-input" placeholder="Password">
        <button class="btn-red" onclick="login()" style="width:100%">ENTRAR</button>
      </div>
      <div id="editForm" style="display:none;">
        <button class="btn-red" onclick="hideAdmin()" style="background:#444;">FECHAR</button>
      </div>
    </div>
  </div>

  <script>
    const DB_URL = "https://karaokelive-ca58e-default-rtdb.europe-west1.firebasedatabase.app/config.json";
    let currentData = { streamUrl: "", wa: "", driveFolderId: "", driveApiKey: "" };

    async function load() {
      try {
        const res = await fetch(DB_URL);
        const data = await res.json();
        if (data) {
          currentData = data;
          document.getElementById('livePlayer').src = data.streamUrl || "";
          fetchVideos();
        }
      } catch (e) { console.error("Erro no Firebase"); }
    }

    async function fetchVideos() {
      if (!currentData.driveFolderId || !currentData.driveApiKey) {
        document.getElementById('vidGrid').textContent = "Configura o Drive no Admin.";
        return;
      }
      try {
        const url = `https://www.googleapis.com/drive/v3/files?q='${currentData.driveFolderId}'+in+parents+and+mimeType+contains+'video/'&key=${currentData.driveApiKey}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
            document.getElementById('vidGrid').innerHTML = data.files.map(f => `<div style="background:#111; padding:10px;">${f.name}</div>`).join('');
        } else {
            document.getElementById('vidGrid').textContent = "Nenhum vídeo encontrado.";
        }
      } catch (e) { document.getElementById('vidGrid').textContent = "Erro ao carregar do Drive."; }
    }

    function openWaBudget() {
      const num = currentData.wa ? currentData.wa.replace(/\D/g, '') : "";
      window.open(`https://wa.me/${num}?text=Orçamento`, "_blank");
    }

    function showAdmin() { document.getElementById('adminArea').style.display = 'block'; }
    function hideAdmin() { document.getElementById('adminArea').style.display = 'none'; }
    
    function login() { 
        if(document.getElementById('u').value === "admin" && document.getElementById('p').value === "CantaAgora2026") {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('editForm').style.display = 'block';
        } else { alert("Erro"); }
    }

    load();
  </script>
</body>
</html>
