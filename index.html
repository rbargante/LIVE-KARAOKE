<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OS CANTA AGORA KARAOKE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ... (Estilos mantidos iguais para manter o design) ... */
    :root { --primary-color: #f52a1f; --dark: #000; --card: #0a0a0a; }
    body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; background: #000; margin: 0; color: #fff; }
    
    /* LIGHTBOX CSS */
    #lightbox { display: none; position: fixed; z-index: 1000000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; }
    #lightbox img { max-width: 90%; max-height: 80%; border-radius: 10px; border: 2px solid #333; }
    .lb-close { position: absolute; top: 20px; right: 30px; font-size: 40px; cursor: pointer; color: white; }
    
    /* ... (restante do CSS anterior permanece idêntico) ... */
  </style>
</head>

<body>
  <div id="lightbox" onclick="closeLightbox()">
    <span class="lb-close">&times;</span>
    <img id="lb-img" src="" onclick="event.stopPropagation()">
  </div>

  <div style="text-align: center; margin: 40px 0;">
    <button class="btn-red" onclick="sharePage()" style="background:#444;">🔗 PARTILHAR ESTA FESTA</button>
    <button class="btn-red" onclick="downloadVcard()" style="background:#333;">📇 GUARDAR CONTACTO</button>
  </div>

  <script>
    // LIGHTBOX FUNÇÕES
    function openLightbox(src) {
      document.getElementById('lb-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }
    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    // PARTILHA NATIVA EM PORTUGUÊS
    function sharePage() {
      if (navigator.share) {
        navigator.share({
          title: 'OS CANTA AGORA KARAOKE',
          text: 'Vê esta animação de Karaoke espetacular e marca a tua festa!',
          url: window.location.href,
        }).catch(console.error);
      } else {
        alert("O teu navegador não suporta partilha direta, mas podes copiar o link na barra de endereço!");
      }
    }

    // VCARD (Guardar Contacto)
    function downloadVcard() {
      const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:OS CANTA AGORA\nTEL:${currentData.wa}\nEND:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'OsCantaAgora.vcf';
      a.click();
    }

    // ... (restante do script mantém-se, certifica-te de atualizar a parte da galeria no renderUI para adicionar onclick="openLightbox('${img}')")
    
    // ATUALIZAÇÃO NO RENDERUI PARA A GALERIA
    // document.getElementById('galGrid').innerHTML = gal.slice(0, limGal).map(img => img ? `<div class="gallery-item" onclick="openLightbox('${img}')"><img src="${img}" loading="lazy"></div>` : '').join('');

    load();
  </script>
</body>
</html>
